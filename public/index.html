      .splash {

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #2e3a2b;
        font-family: "KitsuonSplash", monospace;
      }
      .splash-title {
        font-size: 44px;
        letter-spacing: 6px;
        color: #eef2e6;
      }
      .splash-dots {
        margin-top: 8px;
        font-size: 44px;
        line-height: 1;
        color: #9cc86a;
        white-space: pre;
      }
      .splash-dots::after {
        content: ".  ";
        animation: splash-dots 1.2s steps(1) infinite;
      }
      @keyframes splash-dots {
        0% { content: ".  "; }
        33.33% { content: " . "; }

        height: 100%;

    <noscript>吃音村を遊ぶには JavaScript を有効にしてください。</noscript>

        <div class="splash-title">吃音村β版</div>
