      textarea:focus {
        outline: none;

        font-family: "KitsuonSplash", monospace;
      }
      .splash-title {
        font-size: 44px;
        letter-spacing: 6px;
        color: #eef2e6;
      }
      .splash-dots {
        margin-top: 8px;
        font-size: 44px;
        line-height: 1;
        color: #9cc86a;
        white-space: pre;
      }
      .splash-dots::after {
        content: ".  ";
        animation: splash-dots 1.2s steps(1) infinite;
      }
      @keyframes splash-dots {
        0% { content: ".  "; }
        33.33% { content: " . "; }
        66.66% { content: ". ."; }

        display: flex;
        height: 100%;
        flex: 1;

  <body>
    <noscript>吃音村を遊ぶには JavaScript を有効にしてください。</noscript>
    <div id="root">
      <div class="splash" role="status" aria-label="吃音村を読み込んでいます">
        <div class="splash-title">吃音村</div>
        <div class="splash-dots" aria-hidden="true"></div>
